apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nvmeof-gateway
  namespace: flux-system
spec:
  interval: 2m
  path: ./deploy
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: nvmeof-gateway
  # Ensures the namespace exists before deploy/ is applied
  dependsOn: []
  targetNamespace: nvmeof-gateway
