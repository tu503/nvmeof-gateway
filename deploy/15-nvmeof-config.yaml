apiVersion: v1
kind: ConfigMap
metadata:
  name: nvmeof-gateway-config
  namespace: nvmeof-gateway
data:
  # ceph-nvmeof.conf — per-gateway overrides are injected via envsubst
  # at pod start (GATEWAY_NAME, GATEWAY_GROUP, POD_IP).
  #
  # Reference: https://github.com/ceph/ceph-nvmeof/blob/main/ceph-nvmeof.conf
  ceph-nvmeof.conf.tmpl: |
    [gateway]
    name = ${GATEWAY_NAME}
    group = rbd-default
    addr = 0.0.0.0
    port = ${GRPC_PORT}
    enable_auth = False
    state_update_notify = True
    state_update_interval_sec = 5
    enable_spdk_discovery_controller = False
    omap_file_lock_duration = 20
    omap_file_lock_retries = 30
    omap_file_lock_retry_sleep_interval = 1.0
    omap_file_update_reloads = 10
    max_subsystems = 128
    max_namespaces = 1024
    max_namespaces_per_subsystem = 256
    max_hosts_per_subsystem = 32
    # The listener IP we advertise is the MetalLB VIP (10.144.27.22x),
    # which isn't actually bound on this pod's interface — MetalLB
    # rewrites externally. Disable the bind-check so the gateway
    # accepts the advertised IP and binds 0.0.0.0 internally.
    verify_listener_ip = False
    # Don't suicide on transient state-update errors. The gateway-server
    # default treats any rpc failure (e.g. the other gateway's listener
    # whose host-name doesn't match) as fatal. With ANA HA both pods see
    # the same OMAP and process each other's listener entries; the
    # "host name differs" rejection should log + skip, not abort.
    abort_on_update_error = False
    abort_on_errors = False

    [gateway-logs]
    log_level = INFO

    [discovery]
    addr = 0.0.0.0
    port = ${DISCOVERY_PORT}

    [ceph]
    pool = nvmeof
    config_file = /etc/ceph/ceph.conf
    id = nvmeof.${GATEWAY_NAME}

    [mtls]
    server_key = ''
    client_key = ''
    server_cert = ''
    client_cert = ''

    [spdk]
    tgt_path = /usr/local/bin/nvmf_tgt
    rpc_socket_dir = /var/tmp/
    rpc_socket_name = spdk.sock
    timeout = 60
    log_level = WARNING
    transports = tcp
    transport_tcp_options = {"in_capsule_data_size": 8192, "max_io_qpairs_per_ctrlr": 7}
    # Cluster allocator strategy — required by gateway server; pick the
    # default "cluster pool" mode that ceph-nvmeof.conf.example documents.
    cluster_connections = 32
