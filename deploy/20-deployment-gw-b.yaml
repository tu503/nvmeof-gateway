apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvmeof-gw-b
  namespace: nvmeof-gateway
  labels:
    app: nvmeof
    gateway: gw-b
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nvmeof
      gateway: gw-b
  template:
    metadata:
      labels:
        app: nvmeof
        gateway: gw-b
    spec:
      nodeSelector:
        kubernetes.io/hostname: sm3
      # hostNetwork: SPDK NVMe-oF must bind a locally-assigned IP, and the
      # initiator's nvme-tcp transport address must match the bind. Sharing
      # sm3's network namespace lets us bind sm3's 10.144.27.26 directly.
      # Per-gateway ports differentiate gw-b (4420/5500/8009) from gw-b
      # (4421/5501/8010) since they share sm3's port space.
      hostNetwork: true
      hostname: gw-b
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: gateway
          image: registry.alcg.io/ceph-nvmeof:upstream
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN", "SYS_NICE", "IPC_LOCK"]
          env:
            - { name: GATEWAY_NAME,   value: gw-b }
            - { name: GRPC_PORT,      value: "5501" }
            - { name: DATA_PORT,      value: "4421" }
            - { name: DISCOVERY_PORT, value: "8010" }
          command: ["/bin/sh","-c"]
          args:
            - |
              set -e
              sed -e "s/\${GATEWAY_NAME}/$GATEWAY_NAME/g" \
                  -e "s/\${GRPC_PORT}/$GRPC_PORT/g" \
                  -e "s/\${DISCOVERY_PORT}/$DISCOVERY_PORT/g" \
                  /etc/ceph-nvmeof/ceph-nvmeof.conf.tmpl > /tmp/ceph-nvmeof.conf
              # hostNetwork shares sm3's UTS namespace, so both gateway pods
              # would normally see hostname=sm3 — and ceph-nvmeof routes
              # listener-adds by gethostname(). Create a private UTS and set
              # the per-gateway hostname so each pod claims its own identity
              # (gw-b / gw-b) without touching the host.
              exec unshare --uts -- sh -c "
                echo $GATEWAY_NAME > /proc/sys/kernel/hostname
                exec python3 -m control --config /tmp/ceph-nvmeof.conf
              "
          ports:
            - { name: grpc,      containerPort: 5501, hostPort: 5501, protocol: TCP }
            - { name: nvme-tcp,  containerPort: 4421, hostPort: 4421, protocol: TCP }
            - { name: discovery, containerPort: 8010, hostPort: 8010, protocol: TCP }
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
              hugepages-2Mi: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
              hugepages-2Mi: "1Gi"
          volumeMounts:
            - { name: ceph-config,    mountPath: /etc/ceph/ceph.conf, subPath: ceph.conf,    readOnly: true }
            - { name: ceph-keyring,   mountPath: /etc/ceph/keyring,   subPath: keyring,      readOnly: true }
            - { name: nvmeof-config,  mountPath: /etc/ceph-nvmeof,    readOnly: true }
            - { name: hugepage,       mountPath: /dev/hugepages }
            - { name: dshm,           mountPath: /dev/shm }
      volumes:
        - name: ceph-config
          configMap: { name: ceph-config-nvmeof }
        - name: ceph-keyring
          secret:    { secretName: ceph-nvmeof-keyring-gw-b }
        - name: nvmeof-config
          configMap: { name: nvmeof-gateway-config }
        - name: hugepage
          emptyDir:  { medium: HugePages-2Mi }
        - name: dshm
          emptyDir:  { medium: Memory }
